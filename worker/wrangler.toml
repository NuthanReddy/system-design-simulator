name = "system-design-simulator-links"
main = "src/index.ts"
compatibility_date = "2026-06-23"

workers_dev = true
send_metrics = false

[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Writes per address per minute. Enforced by the runtime, so it is atomic
# and costs no KV writes; a counter in KV would be neither. Twenty is far
# above anyone sharing designs by hand and far below what it would take to
# spend the day's KV write budget.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
ALLOWED_ORIGINS = "https://nuthanreddy.github.io,http://127.0.0.1:4173,http://localhost:5173"
